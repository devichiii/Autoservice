version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: autoservice-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autoservice
      MYSQL_USER: autoservice
      MYSQL_PASSWORD: autoservice
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
